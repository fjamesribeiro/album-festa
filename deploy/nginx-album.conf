# Album da festa — bloco para o nginx que JA roda nesta VPS.
#
# Este arquivo NAO toca a configuracao do movibes.pro. O nginx atende os dois
# sites pelo nome pedido (SNI/Host): movibes.pro continua no bloco dele, e
# srv1325413.hstgr.cloud cai aqui.
#
# Instalar:
#   sudo cp deploy/nginx-album.conf /etc/nginx/sites-available/album
#   sudo ln -s /etc/nginx/sites-available/album /etc/nginx/sites-enabled/album
#   sudo nginx -t                  # NUNCA recarregue sem este teste passar
#   sudo systemctl reload nginx    # reload, nao restart: nao derruba conexao
#
# O certificado e emitido depois, pelo certbot (ver README).

server {
    listen 80;
    listen [::]:80;
    server_name srv1325413.hstgr.cloud;

    # O certbot grava o desafio aqui para provar o dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sintaxe do nginx 1.24 (o que roda nesta VPS). O "http2 on;" separado so
    # existe a partir do 1.25 e derrubaria o teste de configuracao.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srv1325413.hstgr.cloud;

    # Preenchido pelo certbot no primeiro `certbot --nginx -d ...`.
    ssl_certificate     /etc/letsencrypt/live/srv1325413.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1325413.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # UM MEGA ACIMA do MAX_ARQUIVO_MB da aplicacao (12 MB), de proposito.
    # Iguais, o nginx cortaria primeiro e o convidado receberia uma pagina de
    # erro em ingles; com folga, quem recusa e a aplicacao, com mensagem em
    # portugues. Se subir MAX_ARQUIVO_MB no .env, suba este junto.
    client_max_body_size 13M;

    # Rede de seguranca para o que passar mesmo assim (um arquivo gigante
    # nunca chega na aplicacao): responde no mesmo formato JSON que o cliente
    # sabe ler, entao ate o corte do nginx vira mensagem humana na tela.
    error_page 413 = @foto_grande_demais;

    location @foto_grande_demais {
        default_type application/json;
        return 413 '{"enviadas":[],"falhas":[{"nome":null,"motivo":"essa foto é grande demais, tente enviar de novo"}]}';
    }

    # Nao anuncia a versao do nginx.
    server_tokens off;

    # A aplicacao ja emite CSP, HSTS, nosniff e X-Frame-Options. Nao repetimos
    # aqui para nao acabar com cabecalho duplicado e conflitante.

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de 12 MB em 4G ruim demora. Os padroes de 60s cortariam o
        # envio no meio, justamente na rede do salao.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # O ZIP do admin sai em streaming; bufferizar encheria o disco do
        # nginx com um arquivo de varios GB antes de comecar a entregar.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
