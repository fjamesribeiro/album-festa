<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <title>Álbum da festa de {{NOME_ANIVERSARIANTE}}</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Álbum da {{NOME_ANIVERSARIANTE}}</h1>
    <p class="subtitulo">Manda as fotos que você tirou 💜</p>
  </header>

  <main class="conteudo">
    <label class="campo-nome">
      <span>Seu nome (opcional)</span>
      <input type="text" id="autor" maxlength="80" autocomplete="name"
             placeholder="pra gente saber quem mandou">
    </label>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <ul id="lista-falhas" class="falhas" hidden></ul>
    <button type="button" id="tentar-de-novo" class="botao-secundario" hidden>
      Tentar de novo só as que falharam
    </button>
  </main>

  <div class="barra-inferior">
    <button type="button" id="enviar" class="botao-enviar">
      <span id="rotulo-enviar">Enviar fotos</span>
      <span id="progresso" class="progresso" hidden><i id="progresso-barra"></i></span>
    </button>
  </div>

  <input type="file" id="arquivos" accept="image/*" multiple hidden>

  <script src="/app.js"></script>
</body>
</html>
