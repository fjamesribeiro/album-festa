<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <meta name="robots" content="noindex, nofollow">
  <title>Álbum da festa de {{NOME_ANIVERSARIANTE}}</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Álbum da {{NOME_ANIVERSARIANTE}}</h1>
    <p class="contador" id="contador">carregando…</p>
  </header>

  <main class="conteudo">
    <label class="campo-nome">
      <span>Seu nome (opcional)</span>
      <input type="text" id="autor" maxlength="80" autocomplete="name"
             placeholder="pra gente saber quem mandou">
    </label>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <ul id="lista-falhas" class="falhas" hidden></ul>
    <button type="button" id="tentar-de-novo" class="botao-secundario" hidden>
      Tentar de novo só as que falharam
    </button>

    <p id="aviso" class="aviso" role="alert" hidden></p>

    <div id="vazio" class="vazio" hidden>
      <p class="vazio-titulo">Ainda não tem nenhuma foto aqui</p>
      <p>Que tal a sua ser a primeira? É só tocar no botão ali embaixo.</p>
    </div>

    <div id="grade" class="grade"></div>
    <div id="sentinela" class="sentinela" aria-hidden="true"></div>
  </main>

  <button type="button" id="enviar" class="botao-enviar">
    <span class="progresso-fundo" aria-hidden="true"><i id="progresso-barra"></i></span>
    <span id="rotulo-enviar" class="rotulo-enviar">Enviar fotos</span>
  </button>

  <input type="file" id="arquivos" accept="image/*" multiple hidden>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Foto" hidden>
    <div class="lightbox-topo">
      <span id="lightbox-posicao" class="lightbox-posicao"></span>
      <a id="lightbox-baixar" class="lightbox-acao" href="#" download>Baixar</a>
      <button type="button" id="lightbox-fechar" class="lightbox-acao" aria-label="Fechar">Fechar</button>
    </div>

    <div id="lightbox-palco" class="lightbox-palco">
      <img id="lightbox-imagem" alt="">
    </div>

    <div class="lightbox-rodape">
      <button type="button" id="lightbox-anterior" class="lightbox-seta" aria-label="Foto anterior">‹</button>
      <p id="lightbox-legenda" class="lightbox-legenda"></p>
      <button type="button" id="lightbox-proxima" class="lightbox-seta" aria-label="Próxima foto">›</button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
